<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租户列表 — 消防维保平台</title>
  <style>
    /* ===== CSS 变量（来源：design-tokens.md） ===== */
    :root {
      /* 背景 */
      --bg-main: #F0F1F6;
      --bg-card: #FFFFFF;
      --bg-sub-card: #FBFBFB;

      /* 文字 */
      --text-primary: #101010;
      --text-secondary: #2E2E2E;
      --text-tertiary: #454545;
      --text-muted: #5E5E5E;
      --text-placeholder: #D9D9D9;

      /* 品牌 */
      --accent-primary: #3678E3;
      --accent-primary-10: rgba(54, 120, 227, 0.10);
      --accent-primary-20: rgba(54, 120, 227, 0.20);
      --accent-dark: #204785;

      /* 边框 */
      --border-high: #D3D3D3;
      --border-default: #E9E9E9;
      --border-low: #F3F3F3;
      --border-hover: rgba(54, 120, 227, 0.19);

      /* 语义色 */
      --semantic-success: #059669;
      --semantic-success-bg: rgba(5, 150, 105, 0.10);
      --semantic-danger: #DC2626;
      --semantic-danger-bg: rgba(220, 38, 38, 0.10);
      --semantic-warning: #D97706;
      --semantic-warning-bg: rgba(217, 119, 6, 0.10);
      --semantic-info: #3678E3;
      --semantic-info-bg: rgba(54, 120, 227, 0.10);
      --semantic-normal: #364153;
      --semantic-normal-bg: #F3F4F6;

      /* 字号（强制映射） */
      --font-h1: 24px;
      --font-h2: 20px;
      --font-h3: 18px;
      --font-h4: 16px;
      --font-body: 16px;
      --font-small: 14px;
      --font-xs: 12px;

      /* 间距（4px 基数） */
      --spacing-4: 4px;
      --spacing-6: 6px;
      --spacing-8: 8px;
      --spacing-12: 12px;
      --spacing-16: 16px;
      --spacing-24: 24px;

      /* 圆角 */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-xl: 14px;

      /* 按钮令牌 */
      --btn-height: 37px;
      --btn-radius: 8px;
      --btn-padding-y: 8px;
      --btn-padding-x: 12px;
      --btn-font-size: 14px;
      --btn-font-weight: 400;
      --btn-gap: 8px;
    }

    /* ===== 全局重置 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Alibaba PuHuiTi", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: var(--font-body); color: var(--text-primary); background: var(--bg-main);
    }

    /* ===== Header ===== */
    .header {
      height: 48px; background: var(--bg-card); border-bottom: 1px solid var(--border-default);
      display: flex; align-items: center; padding: 0 var(--spacing-24);
    }
    .header-logo { font-size: var(--font-h3); font-weight: 500; color: var(--text-primary); }
    .header-sub { font-size: var(--font-small); color: var(--text-secondary); margin-left: var(--spacing-8); }

    /* ===== 内容区 ===== */
    .content { max-width: 1400px; margin: 0 auto; padding: var(--spacing-24); }

    /* ===== 引导说明区 ===== */
    .guide-card {
      background: var(--accent-primary-10); border-radius: var(--radius-lg);
      padding: var(--spacing-16) var(--spacing-24); margin-bottom: var(--spacing-16);
      border: 1px solid var(--accent-primary-20);
    }
    .guide-header {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
    }
    .guide-title { font-size: var(--font-h4); font-weight: 500; color: var(--text-primary); }
    .guide-toggle { color: var(--accent-primary); font-size: var(--font-small); }
    .guide-body {
      margin-top: var(--spacing-12); padding-top: var(--spacing-12);
      border-top: 1px solid var(--accent-primary-20); color: var(--text-secondary); font-size: var(--font-small);
      line-height: 1.8;
    }
    .guide-body .step { display: flex; align-items: flex-start; gap: var(--spacing-8); margin-bottom: var(--spacing-4); }
    .guide-body .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent-primary); color: #fff; font-size: var(--font-xs); flex-shrink: 0;
    }

    /* ===== 搜索筛选区 ===== */
    .filter-bar {
      display: flex; align-items: flex-start; gap: var(--spacing-12);
      padding: var(--spacing-16) var(--spacing-24); background: var(--bg-card);
      border-radius: var(--radius-lg); margin-bottom: var(--spacing-16);
      flex-wrap: wrap; justify-content: space-between;
    }
    .filter-left { display: flex; align-items: center; gap: var(--spacing-8); flex-wrap: wrap; flex: 1; }
    .filter-right { display: flex; align-items: center; flex-shrink: 0; }
    .filter-bar input[type="search"],
    .filter-bar select {
      height: 32px; padding: 0 var(--spacing-12); border: 1px solid var(--border-default);
      border-radius: var(--radius-sm); font-size: var(--font-body);
      color: var(--text-primary); background: var(--bg-card); outline: none;
    }
    .filter-bar input[type="search"] { width: 200px; }
    .filter-bar select { min-width: 130px; }
    .filter-bar input:focus, .filter-bar select:focus { border-color: var(--accent-primary); }
    .filter-folded { display: none; align-items: center; gap: var(--spacing-8); flex-wrap: wrap; width: 100%; padding-top: var(--spacing-8); }
    .filter-folded.show { display: flex; }
    .fold-toggle {
      color: var(--accent-primary); cursor: pointer; font-size: var(--font-small); white-space: nowrap;
      display: inline-flex; align-items: center; gap: 4px; user-select: none;
    }

    /* ===== 按钮 ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--btn-gap);
      height: var(--btn-height); padding: var(--btn-padding-y) var(--btn-padding-x);
      border-radius: var(--btn-radius);
      font-size: var(--btn-font-size); font-weight: var(--btn-font-weight);
      cursor: pointer; border: none; white-space: nowrap; transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent-primary); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-default { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-default); }
    .btn-default:hover { color: var(--accent-primary); border-color: var(--accent-primary); }
    .btn-danger { background: var(--semantic-danger); color: #fff; }
    .btn-danger:disabled { opacity: .4; cursor: not-allowed; }
    .btn-link {
      background: none; border: none; color: var(--accent-primary); padding: 0; height: auto; cursor: pointer;
      font-size: var(--font-small);
    }
    .btn-link:hover { opacity: .7; }
    .btn-sm { height: 28px; padding: 0 var(--spacing-12); font-size: var(--font-xs); }

    /* ===== 操作栏 ===== */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: var(--spacing-12);
    }
    .toolbar-left { color: var(--text-secondary); font-size: var(--font-small); }

    /* ===== 表格 ===== */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse; background: var(--bg-card);
      border-radius: var(--radius-lg); overflow: hidden;
      min-width: 1400px;
    }
    thead { background: var(--bg-sub-card); }
    th, td {
      padding: var(--spacing-12); text-align: left;
      border-bottom: 1px solid var(--border-default); font-size: var(--font-body); white-space: nowrap;
    }
    th { color: var(--text-secondary); font-weight: 400; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-sub-card); }
    th:first-child, td:first-child { padding-left: var(--spacing-16); width: 40px; }
    th:last-child, td:last-child { padding-right: var(--spacing-16); }

    /* 操作列 sticky */
    .sticky-right {
      position: sticky; right: 0; background: var(--bg-card); z-index: 1;
      box-shadow: -4px 0 8px -4px rgba(0,0,0,.06);
    }
    tr:hover .sticky-right { background: var(--bg-sub-card); }

    /* ===== 标签 ===== */
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm);
      font-size: var(--font-small); line-height: 20px;
    }
    .tag-success { background: var(--semantic-success-bg); color: var(--semantic-success); }
    .tag-danger { background: var(--semantic-danger-bg); color: var(--semantic-danger); }
    .tag-normal { background: var(--semantic-normal-bg); color: var(--semantic-normal); }

    /* ===== 行操作链接 ===== */
    .row-actions { display: flex; gap: var(--spacing-8); flex-wrap: nowrap; }
    .row-actions a {
      color: var(--accent-primary); text-decoration: none; font-size: var(--font-small); cursor: pointer;
    }
    .row-actions a:hover { opacity: .7; }
    .row-actions a.action-danger { color: var(--semantic-danger); }

    /* ===== 分页 ===== */
    .pagination {
      display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-8);
      padding: var(--spacing-16) 0;
    }
    .pagination button {
      min-width: 32px; height: 32px; padding: 0 8px;
      border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: var(--font-small);
    }
    .pagination button.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }
    .pagination .page-info { color: var(--text-secondary); font-size: var(--font-small); margin-right: var(--spacing-8); }
    .pagination select { height: 32px; padding: 0 8px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-size: var(--font-small); }

    /* ===== 域名 Tag ===== */
    .domain-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .domain-tag {
      padding: 1px 6px; border-radius: var(--radius-sm); font-size: var(--font-xs); line-height: 18px;
      background: var(--semantic-warning-bg); color: var(--semantic-warning);
    }

    /* ===== 自适应 ===== */
    @media (max-width: 800px) {
      .content { padding: var(--spacing-12); }
      .filter-bar { flex-direction: column; }
      .filter-left { flex-direction: column; width: 100%; }
      .filter-bar input[type="search"] { width: 100%; }
      .pagination { justify-content: center; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

            <option value="医院">医院</option>

          <select id="dimCFilter" onchange="refresh()">

            <option value="高层建筑">高层建筑</option>
            <option value="普通商铺">普通商铺</option>
            <option value="地下建筑">地下建筑</option>
          </select>
        </div>
      </div>
      <div class="filter-right">
        <button class="btn btn-primary" onclick="handleAdd()">＋ 新增租户</button>
      </div>
    </div>

    <!-- 操作栏 -->
    <div class="toolbar">
      <span class="toolbar-left">已选 <b id="selectedCount">0</b> 项</span>
      <div>
        <button class="btn btn-danger" id="batchDeleteBtn" disabled onclick="handleBatchDelete()">批量删除</button>
      </div>
    </div>

    <!-- 数据表格 -->
    <div class="table-wrap">

            <th class="sticky-right" style="padding-right:var(--spacing-16);">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination"></div>
  </main>

      1: { text:'有效', cls:'success' },
      0: { text:'已锁定', cls:'danger' },
      2: { text:'已过期', cls:'normal' },
    };

    // ===== 分页状态 =====
    let currentPage = 1;
    let pageSize = 20;
    let selectedIds = new Set();

    // ===== 引导说明区折叠（localStorage 持久化） =====
    function toggleGuide() {
      const body = document.getElementById('guideBody');
      const toggle = document.getElementById('guideToggle');
      if (body.style.display === 'none') {
        body.style.display = 'block';
        toggle.textContent = '收起 ▲';
        localStorage.setItem('tenantGuideCollapsed', '0');
      } else {
        body.style.display = 'none';
        toggle.textContent = '展开 ▼';
        localStorage.setItem('tenantGuideCollapsed', '1');
      }
    }

    function toggleFold() {
      const el = document.getElementById('foldFilters');
      const arrow = document.getElementById('foldArrow');
      el.classList.toggle('show');
      arrow.textContent = el.classList.contains('show') ? '▲' : '▼';
    }

    // ===== 获取筛选后的数据 =====
    function getFilteredData() {
      const keyword = document.getElementById('keywordInput').value.trim().toLowerCase();
      const dimB = document.getElementById('dimBFilter').value;
      const dimC = document.getElementById('dimCFilter').value;
      const dimD = document.getElementById('dimDFilter').value;
      return mockData.filter(item => {
        if (keyword && !item.name.toLowerCase().includes(keyword)) return false;
        if (dimB && item.dimB !== dimB) return false;
        if (dimC && item.dimC !== dimC) return false;
        if (dimD && item.dimD !== dimD) return false;
        return true;
      });
    }

    // ===== 渲染表格 =====
    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const selfId = mockData.find(d => d._isSelf)?.id;
      selectedIds.clear();
      document.getElementById('selectAll').checked = false;
      tbody.innerHTML = data.map(item => {
        const s = STATUS_MAP[item.status] || { text:'未知', cls:'normal' };
        const isValid = item.status === 1;
        const hasValidTo = !!item.validTo;
        const isSelf = item.id === selfId;
        let actions = `<a onclick="handleDetail('${item.id}')">详情</a>`;
        if (!isSelf && isValid) actions += ` <a onclick="handleEdit('${item.id}')">编辑</a>`;
        if (!isSelf && isValid) actions += ` <a class="action-danger" onclick="handleLock('${item.id}','${item.name}')">锁定</a>`;
        if (!isSelf && isValid && hasValidTo) actions += ` <a onclick="handleExtend('${item.id}','${item.validTo}')">延期</a>`;
        actions += ` <a onclick="handleCustom('${item.id}')">个性化</a>`;
        actions += ` <a onclick="handleAppConfig('${item.id}')">应用配置</a>`;
        const validRange = item.validFrom ? `${item.validFrom || '—'} ~ ${item.validTo || '永久'}` : '—';
        const tagsHtml = item.tags.length ? item.tags.map(t => `<span class="domain-tag">${t}</span>`).join('') : '';
        return `
          <tr>
            <td><input type="checkbox" value="${item.id}" onchange="onSelect(this)" ${isSelf ? 'disabled' : ''}></td>
            <td>${item.name}${tagsHtml ? ' ' + tagsHtml : ''}</td>
            <td style="color:var(--text-secondary);">${item.code}</td>
            <td>${item.dimB || '—'}</td>
            <td>${item.dimC || '—'}</td>
            <td>${item.dimD || '—'}</td>
            <td>${item.region || '—'}</td>
            <td>${item.contactName}</td>
            <td>${item.contactPhone}</td>
            <td><span class="tag tag-${s.cls}">${s.text}</span></td>
            <td style="color:var(--text-secondary);">${validRange}</td>
            <td style="color:var(--text-secondary);">${item.createdAt}</td>
            <td class="sticky-right"><div class="row-actions">${actions}</div></td>
          </tr>`;
      }).join('');
    }

    // ===== 渲染分页 =====
    function renderPagination(total) {
      const totalPages = Math.ceil(total / pageSize) || 1;
      let html = `<span class="page-info">共 ${total} 条</span>`;
      html += `<select onchange="changePageSize(this.value)">`;
      [10,20,50,100].forEach(s => {
        html += `<option value="${s}" ${pageSize === s ? 'selected' : ''}>${s} 条/页</option>`;
      });
      html += `</select>`;
      html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">‹</button>`;
      for (let i = 1; i <= Math.min(totalPages, 7); i++) {
        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      if (totalPages > 7) html += `<span style="color:var(--text-muted)">…</span><button onclick="goToPage(${totalPages})">${totalPages}</button>`;
      html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">›</button>`;
      document.getElementById('pagination').innerHTML = html;
    }

    // ===== 分页操作 =====
    function goToPage(page) { currentPage = page; refresh(); }
    function changePageSize(size) { pageSize = parseInt(size); currentPage = 1; refresh(); }

    // ===== 选择 =====
    function onSelect(cb) {
      if (cb.checked) selectedIds.add(cb.value); else selectedIds.delete(cb.value);
      document.getElementById('selectedCount').textContent = selectedIds.size;
      document.getElementById('batchDeleteBtn').disabled = selectedIds.size === 0;
    }
    function toggleSelectAll() {
      const checked = document.getElementById('selectAll').checked;
      document.querySelectorAll('#tableBody input[type="checkbox"]:not(:disabled)').forEach(cb => {
        cb.checked = checked;
        if (checked) selectedIds.add(cb.value); else selectedIds.delete(cb.value);
      });
      document.getElementById('selectedCount').textContent = selectedIds.size;
      document.getElementById('batchDeleteBtn').disabled = selectedIds.size === 0;
    }

    // ===== 操作 =====
    function handleAdd() { alert('跳转至：/admin/enterpriseManagement/create'); }
    function handleDetail(id) { alert(`跳转详情：id=${id}`); }
    function handleEdit(id) { alert(`跳转编辑：id=${id}`); }
    function handleLock(id, name) {
      if (confirm(`确认锁定「${name}」？锁定后该企业不可登录。`)) {
        const item = mockData.find(d => d.id === id);
        if (item) { item.status = 0; refresh(); }
      }
    }
    function handleExtend(id, currentTo) {
      const newDate = prompt('请输入新的有效期止（YYYY-MM-DD）：', currentTo || '');
      if (newDate) {
        const item = mockData.find(d => d.id === id);
        if (item) { item.validTo = newDate; refresh(); }
      }
    }
    function handleCustom(id) { alert(`打开个性化配置：id=${id}\n（域名 / 版权公告 / ICP备案 / 平台标题）`); }
    function handleAppConfig(id) { alert(`打开应用配置：id=${id}\n（13 域 Tab × 模块树）`); }
    function handleBatchDelete() {
      if (selectedIds.size === 0) return;
      if (confirm(`确认删除选中的 ${selectedIds.size} 个企业？`)) {
        selectedIds.forEach(id => {
          const idx = mockData.findIndex(d => d.id === id);
          if (idx !== -1) mockData.splice(idx, 1);
        });
        selectedIds.clear();
        currentPage = 1;
        refresh();
      }
    }
    function resetFilter() {
      document.getElementById('keywordInput').value = '';
      document.getElementById('dimBFilter').value = '';
      document.getElementById('dimCFilter').value = '';
      document.getElementById('dimDFilter').value = '';
      currentPage = 1;
      refresh();
    }

    // ===== 驱动 =====
    function refresh() {
      const filtered = getFilteredData();
      const paged = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      renderTable(paged);
      renderPagination(filtered.length);
      document.getElementById('selectedCount').textContent = '0';
      document.getElementById('batchDeleteBtn').disabled = true;
    }

    // ===== 初始化 =====
    if (localStorage.getItem('tenantGuideCollapsed') === '1') {
      document.getElementById('guideBody').style.display = 'none';
      document.getElementById('guideToggle').textContent = '展开 ▼';
    }
    refresh();
  </script>
</body>
</html>
