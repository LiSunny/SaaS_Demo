<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>智能安全管控平台</title>
    <!--
      ⚠️ 性能说明（2026-11-12 首屏优化）

      不要再在 <head> 里同步引入外部资源。原先这里的三个同步标签
      会阻塞 HTML 解析和首次绘制，实测国内 4G 下让首屏 FCP 达到 14 秒：

        1. Google Fonts（fonts.googleapis.com）—— 国内访问慢且常被阻断，
           还会再回 fonts.gstatic.com 拉切片。
           → 已改为本地自托管：src/styles/webfonts.css（保留 unicode-range 分片，
             浏览器仍按需只下命中的分片）

        2. 高德地图 JSAPI（284KB，另发 restapi.amap.com 的 log 请求）
           → 已改为按需动态加载：src/utils/amapLoader.ts，只有真正开地图的页面才拉

        3. mermaid（739KB，仅隐患介绍页用）
           → 已改为页面内动态 import（npm 依赖），不再全站买单

      自定义字体（Source-KeynoteartHans 等）的 @font-face 声明在
      src/styles/local-fonts.css，同样已子集化（10MB → 278KB）。
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
