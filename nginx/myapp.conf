# ============================================================
# maintenance-demo Nginx 配置
# 由 deploy.sh 自动同步到服务器 /etc/nginx/sites-enabled/myapp
# ============================================================

server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;
    
    # 文件上传
    client_max_body_size 20M;
    
    # SSL 证书
    ssl_certificate     /ssl-certs/lyspace.top.pem;
    ssl_certificate_key /ssl-certs/lyspace.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    root /opt/myapp/frontend;
    index index.html;

    # 静态资源：文件名带 hash，可以强缓存一年
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 截图等静态图片也缓存
    location /screenshots/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # favicon 等根目录静态文件
    location ~* \.(ico|png|svg|txt)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html 不缓存（确保更新能获取最新版本）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.db$ {
        deny all;
    }
}
