<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户列表 — 消防维保平台</title>
  <style>
    /* ===== CSS 变量（来源：design-tokens.md） ===== */
    :root {
      --bg-main: #F0F1F6;
      --bg-card: #FFFFFF;
      --bg-sub-card: #FBFBFB;
      --text-primary: #101010;
      --text-secondary: #2E2E2E;
      --text-muted: #5E5E5E;
      --accent-primary: #3678E3;
      --accent-dark: #204785;
      --border-default: #E9E9E9;
      --semantic-success: #059669;
      --semantic-success-bg: rgba(5, 150, 105, 0.10);
      --semantic-danger: #DC2626;
      --semantic-danger-bg: rgba(220, 38, 38, 0.10);
      --semantic-normal: #364153;
      --semantic-normal-bg: #F3F4F6;
      --font-body: 16px;
      --font-small: 14px;
      --font-xs: 12px;
      --font-h3: 18px;
      --font-h4: 16px;
      --spacing-8: 8px;
      --spacing-12: 12px;
      --spacing-16: 16px;
      --spacing-24: 24px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-xl: 14px;
      --btn-height: 37px;
      --btn-radius: 8px;
      --btn-padding-y: 8px;
      --btn-padding-x: 12px;
      --btn-font-size: 14px;
      --btn-font-weight: 400;
      --btn-gap: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Alibaba PuHuiTi", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--font-body); color: var(--text-primary); background: var(--bg-main);
    }

    .header {
      height: 48px; background: var(--bg-card); border-bottom: 1px solid var(--border-default);
      display: flex; align-items: center; padding: 0 var(--spacing-24);
    }
    .header-logo { font-size: var(--font-h4); font-weight: 500; }

    .content { max-width: 1100px; margin: 0 auto; padding: var(--spacing-24); }

    /* 筛选区 */
    .filter-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--spacing-16) var(--spacing-24); background: var(--bg-card);
      border-radius: var(--radius-lg); margin-bottom: var(--spacing-16);
    }
    .filter-left { display: flex; align-items: center; gap: var(--spacing-8); }
    .filter-bar input[type="search"] {
      height: 32px; width: 220px; padding: 0 var(--spacing-12);
      border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      font-size: var(--font-body); color: var(--text-primary); background: var(--bg-card); outline: none;
    }
    .filter-bar input:focus { border-color: var(--accent-primary); }

    /* 按钮 */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--btn-gap);
      height: var(--btn-height); padding: var(--btn-padding-y) var(--btn-padding-x);
      border-radius: var(--btn-radius); font-size: var(--btn-font-size); font-weight: var(--btn-font-weight);
      cursor: pointer; border: none; white-space: nowrap; transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent-primary); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-default { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-default); }
    .btn-link {
      background: none; border: none; color: var(--accent-primary); padding: 0; height: auto; cursor: pointer;
      font-size: var(--font-small);
    }
    .btn-link:hover { opacity: .7; }

    /* 表格 */
    table {
      width: 100%; border-collapse: collapse; background: var(--bg-card);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    thead { background: var(--bg-sub-card); }
    th, td {
      padding: var(--spacing-12) var(--spacing-16); text-align: left;
      border-bottom: 1px solid var(--border-default); font-size: var(--font-body); white-space: nowrap;
    }
    th { color: var(--text-secondary); font-weight: 400; font-size: var(--font-h4); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-sub-card); }
    .sticky-right {
      position: sticky; right: 0; background: var(--bg-card); z-index: 1;
      box-shadow: -4px 0 8px -4px rgba(0,0,0,.06);
    }
    tr:hover .sticky-right { background: var(--bg-sub-card); }
    .empty-row td { text-align: center; color: var(--text-muted); padding: var(--spacing-24); }

    /* 标签 */
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm);
      font-size: var(--font-small); line-height: 20px;
    }
    .tag-success { background: var(--semantic-success-bg); color: var(--semantic-success); }
    .tag-danger { background: var(--semantic-danger-bg); color: var(--semantic-danger); }

    /* 行操作 */
    .row-actions { display: flex; gap: var(--spacing-8); flex-wrap: nowrap; }
    .row-actions a { color: var(--accent-primary); text-decoration: none; font-size: var(--font-small); cursor: pointer; }
    .row-actions a:hover { opacity: .7; }
    .row-actions a.danger { color: var(--semantic-danger); }

    /* 分页 */
    .pagination {
      display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-8);
      padding: var(--spacing-16) 0;
    }
    .pagination button {
      min-width: 32px; height: 32px; padding: 0 8px;
      border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: var(--font-small);
    }
    .pagination button.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }
    .pagination .page-info { color: var(--text-secondary); font-size: var(--font-small); margin-right: var(--spacing-8); }
    .pagination select { height: 32px; padding: 0 8px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-size: var(--font-small); }

    /* 弹窗 */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
      z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg-card); border-radius: var(--radius-xl);
      width: 480px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,.12);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--spacing-16) var(--spacing-24); border-bottom: 1px solid var(--border-default);
      font-size: var(--font-h3); font-weight: 500;
    }
    .modal-body { padding: var(--spacing-24); }
    .modal-footer {
      display: flex; justify-content: flex-end; gap: var(--spacing-8);
      padding: var(--spacing-16) var(--spacing-24); border-top: 1px solid var(--border-default);
    }

    /* 抽屉 */
    .drawer-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000;
    }
    .drawer-overlay.show { display: block; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 480px;
      background: var(--bg-card); box-shadow: -8px 0 40px rgba(0,0,0,.12);
      display: flex; flex-direction: column;
    }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--spacing-16) var(--spacing-24); border-bottom: 1px solid var(--border-default);
      font-size: var(--font-h3); font-weight: 500;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: var(--spacing-24); }

    /* 表单 */
    .form-group { margin-bottom: var(--spacing-16); }
    .form-label { display: block; margin-bottom: var(--spacing-8); font-size: var(--font-small); color: var(--text-secondary); }
    .form-input {
      width: 100%; height: 32px; padding: 0 var(--spacing-12);
      border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      font-size: var(--font-body); color: var(--text-primary); background: var(--bg-card); outline: none;
    }
    .form-input:focus { border-color: var(--accent-primary); }
    .form-input:read-only, .form-input[readonly] { background: var(--bg-sub-card); color: var(--text-muted); cursor: not-allowed; }

    @media (max-width: 800px) {
      .content { padding: var(--spacing-12); }
      .filter-bar { flex-direction: column; gap: var(--spacing-8); }
      .filter-bar input[type="search"] { width: 100%; }
      .modal { width: calc(100vw - 32px); }
      .drawer { width: calc(100vw - 32px); }
    }
  </style>
</head>
<body>
  <header class="header"><span class="header-logo">消防维保平台 — 用户管理</span></header>

  <main class="content">
    <!-- 搜索筛选 -->
    <div class="filter-bar">
      <div class="filter-left">
        <input type="search" id="keywordInput" placeholder="手机号 / 姓名" onkeydown="if(event.key==='Enter')refresh()">
        <button class="btn btn-primary" onclick="refresh()">查询</button>
        <button class="btn btn-default" onclick="resetFilter()">重置</button>
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">＋ 新增用户</button>
    </div>

    <!-- 表格 -->
    <table>
      <thead>
        <tr>
          <th>状态</th>
          <th>手机号</th>
          <th>真实姓名</th>
          <th>邮箱</th>
          <th>关联企业</th>
          <th>创建时间</th>
          <th class="sticky-right">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <!-- 分页 -->
    <div class="pagination" id="pagination"></div>
  </main>

  <!-- 新增用户弹窗 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-header">
        <span>新增用户</span>
        <button class="btn-link" onclick="closeModal('addModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">手机号 <span style="color:var(--semantic-danger)">*</span></label>
          <input class="form-input" id="addPhone" type="text" placeholder="11位手机号" maxlength="11">
        </div>
        <div class="form-group">
          <label class="form-label">真实姓名 <span style="color:var(--semantic-danger)">*</span></label>
          <input class="form-input" id="addName" type="text" placeholder="请输入真实姓名" maxlength="20">
        </div>
        <div class="form-group">
          <label class="form-label">初始密码 <span style="color:var(--semantic-danger)">*</span></label>
          <input class="form-input" id="addPassword" type="password" placeholder="6-20位，首次登录强制修改" minlength="6" maxlength="20">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('addModal')">取消</button>
        <button class="btn btn-primary" onclick="submitAdd()">保存</button>
      </div>
    </div>
  </div>

  <!-- 编辑用户弹窗 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <span>编辑用户</span>
        <button class="btn-link" onclick="closeModal('editModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input class="form-input" id="editPhone" type="text" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">真实姓名 <span style="color:var(--semantic-danger)">*</span></label>
          <input class="form-input" id="editName" type="text" maxlength="20">
        </div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input class="form-input" id="editEmail" type="email" placeholder="请输入邮箱">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('editModal')">取消</button>
        <button class="btn btn-primary" onclick="submitEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- 关联企业抽屉 -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()">
    <div class="drawer" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <span>关联企业</span>
        <button class="btn-link" onclick="closeDrawer()">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <script>
    // ===== Mock 数据 =====
    const NOW = new Date();
    const fmt = d => { const dt = new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`; };
    const daysAgo = n => { const d = new Date(NOW); d.setDate(d.getDate() - n); return fmt(d); };

    let mockId = 100;
    const mockData = [
      { id:1, phone:'13800001111', realName:'张明远', email:'zhangmy@example.com', status:1, enterpriseCount:3, creatorName:'系统管理员', createdAt:daysAgo(90), lastLoginAt:daysAgo(0.5), lastLoginIp:'192.168.1.101' },
      { id:2, phone:'13900002222', realName:'李芳华', email:'', status:1, enterpriseCount:5, creatorName:'系统管理员', createdAt:daysAgo(85), lastLoginAt:daysAgo(2), lastLoginIp:'192.168.1.102' },
      { id:3, phone:'13700003333', realName:'王建国', email:'wangjg@example.com', status:0, enterpriseCount:2, creatorName:'张明远', createdAt:daysAgo(75), lastLoginAt:daysAgo(15), lastLoginIp:'192.168.2.50' },
      { id:4, phone:'13600004444', realName:'赵雪梅', email:'zhaoxm@example.com', status:1, enterpriseCount:0, creatorName:'系统管理员', createdAt:daysAgo(60), lastLoginAt:null, lastLoginIp:null },
      { id:5, phone:'13500005555', realName:'陈志强', email:'', status:0, enterpriseCount:1, creatorName:'李芳华', createdAt:daysAgo(55), lastLoginAt:daysAgo(30), lastLoginIp:'192.168.3.12' },
      { id:6, phone:'13400006666', realName:'刘丽丽', email:'liull@example.com', status:1, enterpriseCount:7, creatorName:'系统管理员', createdAt:daysAgo(45), lastLoginAt:daysAgo(1), lastLoginIp:'10.0.0.55' },
      { id:7, phone:'13300007777', realName:'周文博', email:'zhouwb@example.com', status:1, enterpriseCount:1, creatorName:'张明远', createdAt:daysAgo(40), lastLoginAt:daysAgo(3), lastLoginIp:'192.168.1.200' },
      { id:8, phone:'13200008888', realName:'吴晓燕', email:'', status:0, enterpriseCount:0, creatorName:'系统管理员', createdAt:daysAgo(30), lastLoginAt:null, lastLoginIp:null },
      { id:9, phone:'13100009999', realName:'郑大伟', email:'zhengdw@example.com', status:1, enterpriseCount:2, creatorName:'陈志强', createdAt:daysAgo(20), lastLoginAt:daysAgo(0.1), lastLoginIp:'192.168.5.88' },
      { id:10, phone:'13000000001', realName:'孙丽萍', email:'', status:1, enterpriseCount:4, creatorName:'系统管理员', createdAt:daysAgo(10), lastLoginAt:daysAgo(7), lastLoginIp:'10.0.1.30' },
      { id:11, phone:'12900000002', realName:'马俊杰', email:'majj@example.com', status:0, enterpriseCount:1, creatorName:'刘丽丽', createdAt:daysAgo(5), lastLoginAt:daysAgo(12), lastLoginIp:'192.168.2.77' },
      { id:12, phone:'12800000003', realName:'黄小兰', email:'huangxl@example.com', status:1, enterpriseCount:3, creatorName:'系统管理员', createdAt:daysAgo(1), lastLoginAt:null, lastLoginIp:null },
    ];

    // 企业 Mock 数据（每个用户随机生成关联企业）
    const enterpriseData = {};
    const eNames = ['杭州万达商场','未来科技城中学','城西快捷酒店','云谷科技有限公司','杭州万象餐饮','余杭区第一人民医院','西溪银泰百货','滨江社区卫生服务中心'];
    const positions = ['安全管理员','消防主管','系统操作员','巡查员'];
    for (const u of mockData) {
      const ents = [];
      const count = u.enterpriseCount;
      for (let i = 0; i < Math.min(count, eNames.length); i++) {
        ents.push({
          enterpriseId: i + 1,
          enterpriseName: eNames[(u.id + i) % eNames.length],
          positions: [positions[(u.id + i) % positions.length]],
          joinedAt: daysAgo(30 + u.id * 3 + i * 7),
        });
      }
      enterpriseData[u.id] = ents;
    }

    // 编辑状态
    let editingId = null;

    // ===== 渲染 =====
    let currentPage = 1;
    let pageSize = 20;
    let filteredData = [...mockData];

    function getFiltered() {
      const kw = document.getElementById('keywordInput').value.trim().toLowerCase();
      if (!kw) return [...mockData];
      return mockData.filter(u =>
        u.phone.includes(kw) || u.realName.toLowerCase().includes(kw)
      );
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      if (data.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="7">暂无用户</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(u => {
        const s = u.status === 1
          ? { text:'启用', cls:'success' }
          : { text:'停用', cls:'danger' };
        const toggleAction = u.status === 1
          ? `<a class="danger" onclick="handleToggle(${u.id},'${u.realName}')">停用</a>`
          : `<a onclick="handleToggle(${u.id},'${u.realName}')">启用</a>`;
        return `
          <tr>
            <td><span class="tag tag-${s.cls}">${s.text}</span></td>
            <td>${u.phone}</td>
            <td>${u.realName}</td>
            <td>${u.email || '<span style="color:var(--text-muted)">—</span>'}</td>
            <td><a class="btn-link" onclick="openDrawer(${u.id})">${u.enterpriseCount} 家企业</a></td>
            <td style="color:var(--text-secondary);">${u.createdAt}</td>
            <td class="sticky-right"><div class="row-actions">
              <a onclick="openEditModal(${u.id})">编辑</a>
              ${toggleAction}
              <a onclick="handleResetPwd(${u.id},'${u.realName}')">重置密码</a>
              <a onclick="openDrawer(${u.id})">关联企业</a>
            </div></td>
          </tr>`;
      }).join('');
    }

    function renderPagination(total) {
      const totalPages = Math.ceil(total / pageSize) || 1;
      let html = `<span class="page-info">共 ${total} 条</span>`;
      html += `<select onchange="changePageSize(this.value)">`;
      [10,20,50].forEach(s => html += `<option value="${s}" ${pageSize===s?'selected':''}>${s} 条/页</option>`);
      html += `</select>`;
      html += `<button ${currentPage===1?'disabled':''} onclick="goToPage(${currentPage-1})">‹</button>`;
      for (let i = 1; i <= Math.min(totalPages, 5); i++) {
        html += `<button class="${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
      }
      if (totalPages > 5) html += `<span style="color:var(--text-muted)">…</span><button onclick="goToPage(${totalPages})">${totalPages}</button>`;
      html += `<button ${currentPage===totalPages?'disabled':''} onclick="goToPage(${currentPage+1})">›</button>`;
      document.getElementById('pagination').innerHTML = html;
    }

    function goToPage(p) { currentPage = p; refresh(); }
    function changePageSize(s) { pageSize = parseInt(s); currentPage = 1; refresh(); }

    // ===== 弹窗 =====
    function openAddModal() {
      document.getElementById('addPhone').value = '';
      document.getElementById('addName').value = '';
      document.getElementById('addPassword').value = '';
      document.getElementById('addModal').classList.add('show');
    }
    function submitAdd() {
      const phone = document.getElementById('addPhone').value.trim();
      const name = document.getElementById('addName').value.trim();
      const pwd = document.getElementById('addPassword').value;
      if (!/^1\d{10}$/.test(phone)) return alert('请输入正确的11位手机号');
      if (!name) return alert('请输入真实姓名');
      if (pwd.length < 6 || pwd.length > 20) return alert('密码长度 6-20 位');
      if (mockData.some(u => u.phone === phone)) return alert('该手机号已存在');
      mockData.unshift({
        id: ++mockId, phone, realName: name, email: '', status: 1, enterpriseCount: 0,
        creatorName: '当前用户', createdAt: fmt(NOW), lastLoginAt: null, lastLoginIp: null,
      });
      enterpriseData[mockId] = [];
      closeModal('addModal');
      currentPage = 1;
      refresh();
    }

    function openEditModal(id) {
      const u = mockData.find(x => x.id === id);
      if (!u) return;
      editingId = id;
      document.getElementById('editPhone').value = u.phone;
      document.getElementById('editName').value = u.realName;
      document.getElementById('editEmail').value = u.email;
      document.getElementById('editModal').classList.add('show');
    }
    function submitEdit() {
      const u = mockData.find(x => x.id === editingId);
      if (!u) return;
      const name = document.getElementById('editName').value.trim();
      if (!name) return alert('请输入真实姓名');
      u.realName = name;
      u.email = document.getElementById('editEmail').value.trim();
      closeModal('editModal');
      editingId = null;
      refresh();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    // ===== 抽屉 =====
    function openDrawer(id) {
      const ents = enterpriseData[id] || [];
      const body = document.getElementById('drawerBody');
      if (ents.length === 0) {
        body.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px 0;">该用户暂未关联任何企业</p>';
      } else {
        body.innerHTML = `
          <table style="box-shadow:none;">
            <thead><tr><th>企业名称</th><th>岗位</th><th>加入时间</th></tr></thead>
            <tbody>${ents.map(e => `
              <tr>
                <td>${e.enterpriseName}</td>
                <td>${e.positions.join('、')}</td>
                <td style="color:var(--text-secondary);">${e.joinedAt}</td>
              </tr>
            `).join('')}</tbody>
          </table>`;
      }
      document.getElementById('drawerOverlay').classList.add('show');
    }
    function closeDrawer() { document.getElementById('drawerOverlay').classList.remove('show'); }

    // ===== 停用/启用 =====
    function handleToggle(id, name) {
      const u = mockData.find(x => x.id === id);
      if (!u) return;
      if (u.status === 1) {
        // 停用需确认
        if (!confirm(`确定停用该用户「${name}」吗？\n停用后所有企业均不可登录。`)) return;
        u.status = 0;
      } else {
        // 启用直接切换
        u.status = 1;
      }
      refresh();
    }

    // ===== 重置密码 =====
    function handleResetPwd(id, name) {
      if (!confirm(`确定重置该用户「${name}」的密码吗？\n重置后密码为随机生成的 6 位数字。`)) return;
      const newPwd = String(Math.floor(100000 + Math.random() * 900000));
      alert(`密码已重置\n新密码：${newPwd}\n请告知用户首次登录后强制修改。`);
    }

    function resetFilter() {
      document.getElementById('keywordInput').value = '';
      currentPage = 1;
      refresh();
    }

    function refresh() {
      filteredData = getFiltered();
      const paged = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      renderTable(paged);
      renderPagination(filteredData.length);
    }

    // ===== 初始化 =====
    refresh();
  </script>
</body>
</html>
